name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-check, unit tests, build
    runs-on: ubuntu-latest
    env:
      # Prisma only needs a syntactically valid URL to generate the client.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build shared packages
        run: npm run build -w @ielts/types -w @ielts/config -w @ielts/validation -w @ielts/db
      - name: Type-check API
        run: npx tsc --noEmit -p apps/api/tsconfig.json
      - name: Unit tests (no database)
        run: npm run test:unit -w @ielts/api
      - name: Build API
        run: npm run build -w @ielts/api
      - name: Build web
        run: npm run build -w @ielts/web
        env:
          API_URL: http://localhost:4000

  integration:
    name: Integration tests (isolated "test" schema)
    # Runs on main and on demand. Needs a DEDICATED CI database: the suite drops and recreates its "test" schema.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.CI_DATABASE_URL }}
      JWT_ACCESS_SECRET: ${{ secrets.CI_JWT_ACCESS_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.CI_JWT_REFRESH_SECRET }}
    steps:
      - name: Check for CI database secrets
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::CI_DATABASE_URL is not set, so the integration tests were skipped. Add the CI_* secrets to run them."
          fi
      - uses: actions/checkout@v4
        if: env.DATABASE_URL != ''
      - uses: actions/setup-node@v4
        if: env.DATABASE_URL != ''
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.DATABASE_URL != ''
      - name: Build shared packages
        if: env.DATABASE_URL != ''
        run: npm run build -w @ielts/types -w @ielts/config -w @ielts/validation -w @ielts/db
      - name: Integration tests
        if: env.DATABASE_URL != ''
        run: npm test -w @ielts/api
        timeout-minutes: 45
